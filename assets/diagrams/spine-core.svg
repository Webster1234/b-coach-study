<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="t d">
  <title id="t">脊柱與核心肌肉</title>
  <desc id="d">脊柱屈伸旋轉側屈與腹直豎脊斜腰方</desc>
  <rect width="700" height="420" rx="16" fill="#1a222d"/>
  <text x="24" y="34" fill="#3d9cf0" font-size="18" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">脊柱動作 × 核心肌群</text>

  <!-- spine column -->
  <g transform="translate(80,70)">
    <rect x="70" y="20" width="20" height="260" rx="6" fill="#2a3544" stroke="#c5d0dc" stroke-width="2"/>
    <circle cx="80" cy="10" r="16" fill="#3a4555" stroke="#c5d0dc" stroke-width="2"/>
    <text x="80" y="310" text-anchor="middle" fill="#8b9bb0" font-size="11" font-family="Segoe UI,PingFang TC,sans-serif">脊柱</text>
    <!-- erector -->
    <path d="M55 40 L55 260" stroke="#3d9cf0" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <path d="M105 40 L105 260" stroke="#3d9cf0" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <text x="20" y="150" fill="#3d9cf0" font-size="11" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">豎脊</text>
    <!-- abs front -->
    <rect x="130" y="80" width="28" height="120" rx="4" fill="#2dd4a8" opacity="0.7"/>
    <text x="144" y="220" text-anchor="middle" fill="#2dd4a8" font-size="11" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">腹直</text>
  </g>

  <!-- action grid -->
  <g font-family="Segoe UI,PingFang TC,sans-serif">
    <rect x="280" y="60" width="180" height="75" rx="8" fill="#212b38" stroke="#2dd4a8"/>
    <text x="294" y="84" fill="#2dd4a8" font-size="13" font-weight="700">屈曲（捲腹）</text>
    <text x="294" y="106" fill="#e8eef5" font-size="11">胸骨往骨盆捲近</text>
    <text x="294" y="124" fill="#8b9bb0" font-size="10">主力：腹直肌</text>

    <rect x="480" y="60" width="180" height="75" rx="8" fill="#212b38" stroke="#3d9cf0"/>
    <text x="494" y="84" fill="#3d9cf0" font-size="13" font-weight="700">伸展（站直）</text>
    <text x="494" y="106" fill="#e8eef5" font-size="11">從彎腰拉直身子</text>
    <text x="494" y="124" fill="#8b9bb0" font-size="10">主力：豎脊肌群</text>

    <rect x="280" y="155" width="180" height="75" rx="8" fill="#212b38" stroke="#e6b450"/>
    <text x="294" y="179" fill="#e6b450" font-size="13" font-weight="700">旋轉（轉身）</text>
    <text x="294" y="201" fill="#e8eef5" font-size="11">像扭毛巾看後座</text>
    <text x="294" y="219" fill="#8b9bb0" font-size="10">主力：腹內／外斜肌</text>

    <rect x="480" y="155" width="180" height="75" rx="8" fill="#212b38" stroke="#e6b450"/>
    <text x="494" y="179" fill="#e6b450" font-size="13" font-weight="700">側屈（側彎）</text>
    <text x="494" y="201" fill="#e8eef5" font-size="11">左右彎去撿東西</text>
    <text x="494" y="219" fill="#8b9bb0" font-size="10">主力：腰方肌</text>
  </g>

  <rect x="280" y="250" width="380" height="130" rx="10" fill="#212b38" stroke="#2d3a4a"/>
  <text x="296" y="278" fill="#e8eef5" font-size="13" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">分層速記</text>
  <text x="296" y="302" fill="#8b9bb0" font-size="12" font-family="Segoe UI,PingFang TC,sans-serif">背側內→外：棘肌／最長肌／髂肋肌（棘最髂）</text>
  <text x="296" y="324" fill="#8b9bb0" font-size="12" font-family="Segoe UI,PingFang TC,sans-serif">腹側深→淺：腹橫 → 腹直 → 內斜 → 外斜</text>
  <text x="296" y="346" fill="#2dd4a8" font-size="12" font-family="Segoe UI,PingFang TC,sans-serif">腹橫＝天然腰帶 · 口令是「四周繃緊」不是死吸肚</text>
  <text x="296" y="368" fill="#e6b450" font-size="11" font-family="Segoe UI,PingFang TC,sans-serif">易混：側屈＝左右彎 · 旋轉＝轉身</text>
</svg>
