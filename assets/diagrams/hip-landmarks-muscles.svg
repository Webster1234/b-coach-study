<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" role="img" aria-labelledby="t d">
  <title id="t">髖關節動作與主力肌</title>
  <desc id="d">髖屈伸外展內收內外轉</desc>
  <rect width="700" height="440" rx="16" fill="#1a222d"/>
  <text x="24" y="34" fill="#3d9cf0" font-size="18" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">髖關節：六大動作方向</text>
  <text x="24" y="54" fill="#8b9bb0" font-size="11" font-family="Segoe UI,PingFang TC,sans-serif">球窩關節 · 大腿相對骨盆怎麼動</text>

  <!-- center pelvis + femur -->
  <ellipse cx="350" cy="160" rx="70" ry="40" fill="#2a3544" stroke="#c5d0dc" stroke-width="2"/>
  <text x="350" y="165" text-anchor="middle" fill="#8b9bb0" font-size="11" font-family="Segoe UI,PingFang TC,sans-serif">骨盆</text>
  <circle cx="350" cy="200" r="22" fill="#3a4555" stroke="#3d9cf0" stroke-width="2"/>
  <line x1="350" y1="220" x2="350" y2="320" stroke="#c5d0dc" stroke-width="16" stroke-linecap="round"/>
  <text x="370" y="280" fill="#e8eef5" font-size="11" font-family="Segoe UI,PingFang TC,sans-serif">股骨</text>

  <!-- action cards -->
  <g font-family="Segoe UI,PingFang TC,sans-serif">
    <rect x="24" y="80" width="150" height="70" rx="8" fill="#212b38" stroke="#3d9cf0"/>
    <text x="36" y="102" fill="#3d9cf0" font-size="13" font-weight="700">屈曲 ↑</text>
    <text x="36" y="122" fill="#e8eef5" font-size="11">大腿往胸口抬</text>
    <text x="36" y="140" fill="#8b9bb0" font-size="10">髂腰、股直、縫匠</text>

    <rect x="24" y="165" width="150" height="70" rx="8" fill="#212b38" stroke="#2dd4a8"/>
    <text x="36" y="187" fill="#2dd4a8" font-size="13" font-weight="700">伸展 ↓</text>
    <text x="36" y="207" fill="#e8eef5" font-size="11">臀推／硬舉打開</text>
    <text x="36" y="225" fill="#8b9bb0" font-size="10">臀大、腿後腱</text>

    <rect x="24" y="250" width="150" height="70" rx="8" fill="#212b38" stroke="#e6b450"/>
    <text x="36" y="272" fill="#e6b450" font-size="13" font-weight="700">外展 →</text>
    <text x="36" y="292" fill="#e8eef5" font-size="11">側抬腿、穩骨盆</text>
    <text x="36" y="310" fill="#8b9bb0" font-size="10">臀中、臀大、TFL</text>

    <rect x="526" y="80" width="150" height="70" rx="8" fill="#212b38" stroke="#e6b450"/>
    <text x="538" y="102" fill="#e6b450" font-size="13" font-weight="700">← 內收</text>
    <text x="538" y="122" fill="#e8eef5" font-size="11">夾腿往中線</text>
    <text x="538" y="140" fill="#8b9bb0" font-size="10">內收肌群</text>

    <rect x="526" y="165" width="150" height="70" rx="8" fill="#212b38" stroke="#3d9cf0"/>
    <text x="538" y="187" fill="#3d9cf0" font-size="13" font-weight="700">內轉 ↻</text>
    <text x="538" y="207" fill="#e8eef5" font-size="11">膝／腳尖較朝內</text>
    <text x="538" y="225" fill="#8b9bb0" font-size="10">臀小／中前、TFL</text>

    <rect x="526" y="250" width="150" height="70" rx="8" fill="#212b38" stroke="#2dd4a8"/>
    <text x="538" y="272" fill="#2dd4a8" font-size="13" font-weight="700">外轉 ↺</text>
    <text x="538" y="292" fill="#e8eef5" font-size="11">膝／腳尖較朝外</text>
    <text x="538" y="310" fill="#8b9bb0" font-size="10">外轉六兄弟＋臀大</text>
  </g>

  <rect x="120" y="350" width="460" height="70" rx="10" fill="#212b38" stroke="#2d3a4a"/>
  <text x="350" y="378" text-anchor="middle" fill="#e8eef5" font-size="12" font-family="Segoe UI,PingFang TC,sans-serif">分層：臀大＝維度（伸髖）· 臀中＝挺度（穩骨盆）· 越深越穩</text>
  <text x="350" y="400" text-anchor="middle" fill="#8b9bb0" font-size="11" font-family="Segoe UI,PingFang TC,sans-serif">內轉外轉 ≠ 前臂旋前旋後（一個轉大腿，一個轉掌心）</text>
</svg>
