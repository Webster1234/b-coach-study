<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
  <title id="t">深蹲髖膝平面</title>
  <desc id="d">深蹲矢狀面髖膝屈伸</desc>
  <rect width="640" height="400" rx="16" fill="#1a222d"/>
  <text x="24" y="34" fill="#3d9cf0" font-size="18" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">深蹲：髖＋膝（矢狀面）</text>

  <!-- standing -->
  <g transform="translate(80,70)">
    <text x="70" y="20" text-anchor="middle" fill="#8b9bb0" font-size="12" font-family="Segoe UI,PingFang TC,sans-serif">站直</text>
    <circle cx="70" cy="50" r="16" fill="#2a3544" stroke="#c5d0dc" stroke-width="2"/>
    <line x1="70" y1="66" x2="70" y2="150" stroke="#c5d0dc" stroke-width="10" stroke-linecap="round"/>
    <line x1="70" y1="150" x2="45" y2="260" stroke="#c5d0dc" stroke-width="9" stroke-linecap="round"/>
    <line x1="70" y1="150" x2="95" y2="260" stroke="#c5d0dc" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- arrow -->
  <path d="M200 180 L250 180" stroke="#2dd4a8" stroke-width="3" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2dd4a8"/>
    </marker>
  </defs>

  <!-- squat -->
  <g transform="translate(280,70)">
    <text x="90" y="20" text-anchor="middle" fill="#3d9cf0" font-size="12" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">蹲下（像坐椅子）</text>
    <circle cx="90" cy="70" r="16" fill="#2a3544" stroke="#c5d0dc" stroke-width="2"/>
    <line x1="90" y1="86" x2="70" y2="150" stroke="#c5d0dc" stroke-width="10" stroke-linecap="round"/>
    <!-- thighs -->
    <line x1="70" y1="150" x2="40" y2="170" stroke="#3d9cf0" stroke-width="10" stroke-linecap="round"/>
    <line x1="70" y1="150" x2="120" y2="170" stroke="#3d9cf0" stroke-width="10" stroke-linecap="round"/>
    <!-- shanks -->
    <line x1="40" y1="170" x2="35" y2="260" stroke="#2dd4a8" stroke-width="9" stroke-linecap="round"/>
    <line x1="120" y1="170" x2="125" y2="260" stroke="#2dd4a8" stroke-width="9" stroke-linecap="round"/>
    <circle cx="70" cy="150" r="7" fill="#e6b450"/>
    <text x="78" y="145" fill="#e6b450" font-size="11" font-family="Segoe UI,PingFang TC,sans-serif">髖屈</text>
    <text x="125" y="185" fill="#2dd4a8" font-size="11" font-family="Segoe UI,PingFang TC,sans-serif">膝屈</text>
  </g>

  <rect x="24" y="300" width="592" height="76" rx="10" fill="#212b38" stroke="#2d3a4a"/>
  <text x="40" y="328" fill="#e8eef5" font-size="13" font-family="Segoe UI,PingFang TC,sans-serif">下去：髖屈＋膝屈（矢狀面）　站起：髖伸＋膝伸</text>
  <text x="40" y="352" fill="#8b9bb0" font-size="12" font-family="Segoe UI,PingFang TC,sans-serif">站起主力：臀大肌（髖伸）＋股四頭肌（膝伸）· 核心穩定 · 膝朝腳尖</text>
</svg>
