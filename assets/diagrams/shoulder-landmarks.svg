<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d">
  <title id="t">肩膀骨頭標記圖</title>
  <desc id="d">肩胛棘、盂窩、喙突、肩峰、鎖骨、肱骨頭標示</desc>
  <rect width="720" height="420" rx="16" fill="#1a222d"/>
  <text x="24" y="36" fill="#3d9cf0" font-size="18" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">肩膀骨頭摸得到哪</text>
  <text x="24" y="58" fill="#8b9bb0" font-size="12" font-family="Segoe UI,PingFang TC,sans-serif">口訣：棘＝背後橫脊 · 盂＝外側淺碗 · 喙＝前方鳥嘴 · 峰＝外側屋簷</text>

  <!-- LEFT: posterior view -->
  <text x="160" y="90" text-anchor="middle" fill="#2dd4a8" font-size="13" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="600">後視（背後摸）</text>
  <!-- scapula plate -->
  <path d="M80 140 L200 130 L250 200 L220 300 L100 290 L70 210 Z" fill="#2a3544" stroke="#c5d0dc" stroke-width="2.5"/>
  <!-- spine of scapula -->
  <path d="M95 175 L230 160" stroke="#e6b450" stroke-width="6" stroke-linecap="round"/>
  <circle cx="230" cy="160" r="10" fill="#3d9cf0" stroke="#e8eef5" stroke-width="1.5"/>
  <!-- acromion tip -->
  <text x="250" y="150" fill="#3d9cf0" font-size="13" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">肩峰</text>
  <text x="250" y="166" fill="#8b9bb0" font-size="10" font-family="Segoe UI,PingFang TC,sans-serif">外側屋簷</text>
  <!-- spine label -->
  <line x1="140" y1="175" x2="100" y2="120" stroke="#e6b450" stroke-width="1.2"/>
  <text x="55" y="112" fill="#e6b450" font-size="13" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">肩胛棘</text>
  <text x="55" y="128" fill="#8b9bb0" font-size="10" font-family="Segoe UI,PingFang TC,sans-serif">背後橫脊</text>
  <!-- glenoid on lateral -->
  <ellipse cx="248" cy="210" rx="14" ry="22" fill="#2dd4a8" opacity="0.85" stroke="#e8eef5" stroke-width="1.5"/>
  <line x1="262" y1="210" x2="300" y2="230" stroke="#2dd4a8" stroke-width="1.2"/>
  <text x="304" y="228" fill="#2dd4a8" font-size="13" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">盂窩</text>
  <text x="304" y="244" fill="#8b9bb0" font-size="10" font-family="Segoe UI,PingFang TC,sans-serif">外側淺碗</text>
  <!-- humeral head ghost -->
  <circle cx="275" cy="210" r="18" fill="none" stroke="#8b9bb0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="268" y="270" fill="#8b9bb0" font-size="10" font-family="Segoe UI,PingFang TC,sans-serif">肱骨頭→</text>

  <!-- RIGHT: anterior view -->
  <text x="520" y="90" text-anchor="middle" fill="#2dd4a8" font-size="13" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="600">前視（前面摸）</text>
  <!-- clavicle -->
  <path d="M390 150 Q470 130 560 155" fill="none" stroke="#c5d0dc" stroke-width="10" stroke-linecap="round"/>
  <text x="450" y="122" fill="#c5d0dc" font-size="13" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">鎖骨</text>
  <!-- acromion end -->
  <ellipse cx="565" cy="158" rx="16" ry="12" fill="#3d9cf0"/>
  <text x="586" y="150" fill="#3d9cf0" font-size="13" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">肩峰</text>
  <!-- coracoid -->
  <path d="M520 168 L505 195 L515 200 L535 175 Z" fill="#e6b450" stroke="#e8eef5" stroke-width="1"/>
  <line x1="505" y1="195" x2="460" y2="230" stroke="#e6b450" stroke-width="1.2"/>
  <text x="400" y="240" fill="#e6b450" font-size="13" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">喙突</text>
  <text x="400" y="256" fill="#8b9bb0" font-size="10" font-family="Segoe UI,PingFang TC,sans-serif">前方鳥嘴</text>
  <!-- scapula hint + glenoid + humerus -->
  <path d="M500 175 L580 190 L570 280 L490 270 Z" fill="#2a3544" stroke="#8b9bb0" stroke-width="1.5" opacity="0.9"/>
  <ellipse cx="585" cy="220" rx="12" ry="18" fill="#2dd4a8" opacity="0.7"/>
  <circle cx="615" cy="220" r="22" fill="#3a4555" stroke="#c5d0dc" stroke-width="2"/>
  <line x1="615" y1="242" x2="615" y2="320" stroke="#c5d0dc" stroke-width="14" stroke-linecap="round"/>
  <text x="640" y="225" fill="#e8eef5" font-size="12" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="600">肱骨頭</text>
  <text x="560" y="310" fill="#2dd4a8" font-size="11" font-family="Segoe UI,PingFang TC,sans-serif">盂窩（深處）</text>

  <text x="360" y="390" text-anchor="middle" fill="#8b9bb0" font-size="11" font-family="Segoe UI,PingFang TC,sans-serif">峰在外上 · 喙在前方 · 棘在背後 · 盂接手臂球頭</text>
</svg>
