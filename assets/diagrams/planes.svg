<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d">
  <title id="t">身體三個平面</title>
  <desc id="d">矢狀面、額狀面、水平面示意</desc>
  <rect width="640" height="420" rx="16" fill="#1a222d"/>
  <text x="24" y="36" fill="#3d9cf0" font-size="18" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">三個平面（切吐司三方向）</text>

  <!-- body stick figure center -->
  <g transform="translate(220,70)">
    <circle cx="100" cy="36" r="22" fill="#2a3544" stroke="#c5d0dc" stroke-width="2"/>
    <path d="M100 58 L100 160" stroke="#c5d0dc" stroke-width="10" stroke-linecap="round"/>
    <path d="M100 80 L40 130 M100 80 L160 130" stroke="#c5d0dc" stroke-width="8" stroke-linecap="round"/>
    <path d="M100 160 L55 250 M100 160 L145 250" stroke="#c5d0dc" stroke-width="8" stroke-linecap="round"/>
    <!-- sagittal plane (blue) vertical left-right split -->
    <rect x="88" y="10" width="24" height="250" rx="4" fill="#3d9cf0" opacity="0.35"/>
    <!-- frontal plane (green) -->
    <rect x="20" y="70" width="160" height="18" rx="3" fill="#2dd4a8" opacity="0.4" transform="rotate(-0)"/>
    <rect x="10" y="40" width="18" height="200" rx="3" fill="#2dd4a8" opacity="0.25"/>
    <!-- transverse plane (amber) -->
    <ellipse cx="100" cy="120" rx="70" ry="14" fill="#e6b450" opacity="0.35"/>
  </g>

  <!-- legend cards -->
  <g font-family="Segoe UI,PingFang TC,sans-serif">
    <rect x="420" y="80" width="190" height="80" rx="10" fill="#212b38" stroke="#3d9cf0" stroke-width="1.5"/>
    <circle cx="442" cy="105" r="8" fill="#3d9cf0"/>
    <text x="458" y="110" fill="#3d9cf0" font-size="14" font-weight="700">矢狀面</text>
    <text x="442" y="132" fill="#e8eef5" font-size="11">切成左／右</text>
    <text x="442" y="148" fill="#8b9bb0" font-size="10">深蹲、彎腰、前平舉</text>

    <rect x="420" y="175" width="190" height="80" rx="10" fill="#212b38" stroke="#2dd4a8" stroke-width="1.5"/>
    <circle cx="442" cy="200" r="8" fill="#2dd4a8"/>
    <text x="458" y="205" fill="#2dd4a8" font-size="14" font-weight="700">額狀面（冠狀）</text>
    <text x="442" y="227" fill="#e8eef5" font-size="11">切成前／後</text>
    <text x="442" y="243" fill="#8b9bb0" font-size="10">側平舉、側彎</text>

    <rect x="420" y="270" width="190" height="80" rx="10" fill="#212b38" stroke="#e6b450" stroke-width="1.5"/>
    <circle cx="442" cy="295" r="8" fill="#e6b450"/>
    <text x="458" y="300" fill="#e6b450" font-size="14" font-weight="700">水平面（橫斷）</text>
    <text x="442" y="322" fill="#e8eef5" font-size="11">切成上／下</text>
    <text x="442" y="338" fill="#8b9bb0" font-size="10">轉身、旋轉、夾胸</text>
  </g>
  <text x="320" y="395" text-anchor="middle" fill="#8b9bb0" font-size="11" font-family="Segoe UI,PingFang TC,sans-serif">考題常問：這個動作在哪個平面？</text>
</svg>
