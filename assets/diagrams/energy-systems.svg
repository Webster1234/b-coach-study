<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d">
  <title id="t">三大能量系統</title>
  <desc id="d">磷酸肌酸最快、糖解其次、有氧最慢但最久；燃料、有氧無氧與例子對照（WG 肌能訓練影片）</desc>
  <rect width="640" height="420" rx="16" fill="#1a222d"/>
  <g font-family="Segoe UI,PingFang TC,Noto Sans TC,sans-serif">
    <text x="24" y="38" fill="#3d9cf0" font-size="19" font-weight="700">三大能量系統（身體的三台發電機）</text>
    <text x="24" y="62" fill="#8b9bb0" font-size="12">口訣：磷快、糖中、氧慢久｜三台同時在轉，只是誰當主力不同〔補充〕</text>

    <!-- card 1 -->
    <rect x="24" y="82" width="186" height="240" rx="12" fill="#212b38" stroke="#f07178" stroke-width="2"/>
    <text x="40" y="112" fill="#f07178" font-size="16" font-weight="700">① 磷酸肌酸</text>
    <text x="40" y="132" fill="#8b9bb0" font-size="12">ATP-CP</text>
    <text x="40" y="162" fill="#e8eef5" font-size="13">燃料：磷酸肌酸</text>
    <text x="40" y="186" fill="#e8eef5" font-size="13">無氧</text>
    <text x="40" y="210" fill="#e8eef5" font-size="13">速度：最快 ⚡⚡⚡</text>
    <text x="40" y="234" fill="#e8eef5" font-size="13">持久：最短</text>
    <text x="40" y="270" fill="#e6b450" font-size="13" font-weight="700">例：100m 衝刺</text>
    <text x="40" y="300" fill="#8b9bb0" font-size="11">比喻：手上現金</text>

    <!-- card 2 -->
    <rect x="227" y="82" width="186" height="240" rx="12" fill="#212b38" stroke="#e6b450" stroke-width="2"/>
    <text x="243" y="112" fill="#e6b450" font-size="16" font-weight="700">② 糖解</text>
    <text x="243" y="132" fill="#8b9bb0" font-size="12">（醣解）</text>
    <text x="243" y="162" fill="#e8eef5" font-size="13">燃料：肝醣、血糖</text>
    <text x="243" y="186" fill="#e8eef5" font-size="13">無氧（產生乳酸）／有氧</text>
    <text x="243" y="210" fill="#e8eef5" font-size="13">速度：其次 ⚡⚡</text>
    <text x="243" y="234" fill="#e8eef5" font-size="12">肝醣→無氧為主</text>
    <text x="243" y="252" fill="#e8eef5" font-size="12">血糖→有氧為主</text>
    <text x="243" y="282" fill="#e6b450" font-size="13" font-weight="700">例：400m</text>
    <text x="243" y="306" fill="#8b9bb0" font-size="11">比喻：冰箱存糧</text>

    <!-- card 3 -->
    <rect x="430" y="82" width="186" height="240" rx="12" fill="#212b38" stroke="#2dd4a8" stroke-width="2"/>
    <text x="446" y="112" fill="#2dd4a8" font-size="16" font-weight="700">③ 有氧</text>
    <text x="446" y="132" fill="#8b9bb0" font-size="12">（氧化系統）</text>
    <text x="446" y="162" fill="#e8eef5" font-size="13">燃料：醣、脂、蛋白質</text>
    <text x="446" y="186" fill="#e8eef5" font-size="13">有氧</text>
    <text x="446" y="210" fill="#e8eef5" font-size="13">速度：最慢 ⚡</text>
    <text x="446" y="234" fill="#e8eef5" font-size="13">持久：最久</text>
    <text x="446" y="270" fill="#e6b450" font-size="13" font-weight="700">例：1000m 以上、慢跑</text>
    <text x="446" y="300" fill="#8b9bb0" font-size="11">比喻：銀行帳戶</text>

    <!-- arrow -->
    <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b9bb0"/></marker></defs>
    <line x1="40" y1="356" x2="600" y2="356" stroke="#8b9bb0" stroke-width="2" marker-end="url(#ar)"/>
    <text x="40" y="346" fill="#f07178" font-size="12">快、短、爆</text>
    <text x="280" y="346" fill="#e6b450" font-size="12">中、會酸</text>
    <text x="500" y="346" fill="#2dd4a8" font-size="12">慢、能撐久</text>
    <text x="40" y="386" fill="#8b9bb0" font-size="11">運動時間越長、強度越低 → 主力越往右邊移</text>
    <text x="40" y="404" fill="#5f6f84" font-size="10">來源：World Gym《肌能訓練》03:55；比喻與箭頭說明為站內補充</text>
  </g>
</svg>
