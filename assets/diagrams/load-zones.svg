<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
  <title id="t">負荷設定：%1RM 與次數</title>
  <desc id="d">WG 影片負荷表：百分比越高能做的次數越少；1到6下肌力、7到12下肌肥大、12到15下肌耐力</desc>
  <rect width="640" height="400" rx="16" fill="#1a222d"/>
  <g font-family="Segoe UI,PingFang TC,Noto Sans TC,sans-serif">
    <text x="24" y="36" fill="#3d9cf0" font-size="19" font-weight="700">負荷設定（WG 影片）：% 越高 → 下數越少</text>
    <text x="24" y="58" fill="#8b9bb0" font-size="12">口訣：1–6 力、7–12 大、12–15 耐　｜　重量＝1RM × %</text>
    <!-- bars: height ∝ %1RM; baseline y=300, scale: 100% -> 200px -->
    <g>
      <rect x="40"  y="100" width="34" height="200" fill="#f07178"/><text x="57"  y="94"  fill="#e8eef5" font-size="11" text-anchor="middle">100</text><text x="57"  y="318" fill="#e8eef5" font-size="12" text-anchor="middle">1</text>
      <rect x="84"  y="110" width="34" height="190" fill="#f07178"/><text x="101" y="104" fill="#e8eef5" font-size="11" text-anchor="middle">95</text><text x="101" y="318" fill="#e8eef5" font-size="12" text-anchor="middle">2</text>
      <rect x="128" y="114" width="34" height="186" fill="#f07178"/><text x="145" y="108" fill="#e8eef5" font-size="11" text-anchor="middle">93</text><text x="145" y="318" fill="#e8eef5" font-size="12" text-anchor="middle">3</text>
      <rect x="172" y="120" width="34" height="180" fill="#f07178"/><text x="189" y="114" fill="#e8eef5" font-size="11" text-anchor="middle">90</text><text x="189" y="318" fill="#e8eef5" font-size="12" text-anchor="middle">4</text>
      <rect x="216" y="126" width="34" height="174" fill="#f07178"/><text x="233" y="120" fill="#e8eef5" font-size="11" text-anchor="middle">87</text><text x="233" y="318" fill="#e8eef5" font-size="12" text-anchor="middle">5</text>
      <rect x="260" y="130" width="34" height="170" fill="#f07178"/><text x="277" y="124" fill="#e8eef5" font-size="11" text-anchor="middle">85</text><text x="277" y="318" fill="#e8eef5" font-size="12" text-anchor="middle">6</text>
      <rect x="304" y="134" width="34" height="166" fill="#e6b450"/><text x="321" y="128" fill="#e8eef5" font-size="11" text-anchor="middle">83</text><text x="321" y="318" fill="#e8eef5" font-size="12" text-anchor="middle">7</text>
      <rect x="348" y="140" width="34" height="160" fill="#e6b450"/><text x="365" y="134" fill="#e8eef5" font-size="11" text-anchor="middle">80</text><text x="365" y="318" fill="#e8eef5" font-size="12" text-anchor="middle">8</text>
      <rect x="392" y="146" width="34" height="154" fill="#e6b450"/><text x="409" y="140" fill="#e8eef5" font-size="11" text-anchor="middle">77</text><text x="409" y="318" fill="#e8eef5" font-size="12" text-anchor="middle">9</text>
      <rect x="436" y="150" width="34" height="150" fill="#e6b450"/><text x="453" y="144" fill="#e8eef5" font-size="11" text-anchor="middle">75</text><text x="453" y="318" fill="#e8eef5" font-size="12" text-anchor="middle">10</text>
      <rect x="480" y="166" width="34" height="134" fill="#e6b450" stroke="#2dd4a8" stroke-width="3"/><text x="497" y="160" fill="#e8eef5" font-size="11" text-anchor="middle">67</text><text x="497" y="318" fill="#e8eef5" font-size="12" text-anchor="middle">12</text>
      <rect x="524" y="170" width="34" height="130" fill="#2dd4a8"/><text x="541" y="164" fill="#e8eef5" font-size="11" text-anchor="middle">65</text><text x="541" y="318" fill="#e8eef5" font-size="12" text-anchor="middle">15</text>
    </g>
    <line x1="34" y1="300" x2="570" y2="300" stroke="#8b9bb0" stroke-width="1.5"/>
    <text x="580" y="318" fill="#8b9bb0" font-size="11">下數</text>
    <text x="580" y="94" fill="#8b9bb0" font-size="11">%1RM</text>
    <!-- legend -->
    <rect x="40" y="338" width="14" height="14" fill="#f07178"/><text x="60" y="350" fill="#e8eef5" font-size="13">1–6 下：肌力（非常重～非常非常重）</text>
    <rect x="330" y="338" width="14" height="14" fill="#e6b450"/><text x="350" y="350" fill="#e8eef5" font-size="13">7–12 下：肌肥大（稍微重～重）</text>
    <rect x="40" y="364" width="14" height="14" fill="#2dd4a8"/><text x="60" y="376" fill="#e8eef5" font-size="13">12–15 下：肌耐力（輕）　＊12 下＝交界；影片表沒列 11 下</text>
  </g>
</svg>
