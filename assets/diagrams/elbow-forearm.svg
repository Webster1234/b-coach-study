<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="t d">
  <title id="t">肘與前臂動作</title>
  <desc id="d">肘屈伸與旋前旋後</desc>
  <rect width="700" height="400" rx="16" fill="#1a222d"/>
  <text x="24" y="36" fill="#3d9cf0" font-size="18" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">肘屈伸 · 前臂旋前／旋後</text>

  <!-- Elbow flexion/extension -->
  <rect x="24" y="56" width="320" height="320" rx="12" fill="#212b38" stroke="#3d9cf0" stroke-width="1.2"/>
  <text x="184" y="84" text-anchor="middle" fill="#3d9cf0" font-size="14" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">肘關節：屈 ↔ 伸</text>
  <!-- arm bent -->
  <g transform="translate(60,120)">
    <line x1="40" y1="20" x2="40" y2="100" stroke="#c5d0dc" stroke-width="14" stroke-linecap="round"/>
    <line x1="40" y1="100" x2="120" y2="100" stroke="#c5d0dc" stroke-width="12" stroke-linecap="round"/>
    <circle cx="40" cy="100" r="10" fill="#3d9cf0"/>
    <text x="55" y="90" fill="#3d9cf0" font-size="12" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">屈曲</text>
    <text x="55" y="130" fill="#8b9bb0" font-size="10" font-family="Segoe UI,PingFang TC,sans-serif">彎舉＝肘屈</text>
  </g>
  <!-- arm straight -->
  <g transform="translate(200,110)">
    <line x1="30" y1="20" x2="30" y2="160" stroke="#c5d0dc" stroke-width="14" stroke-linecap="round"/>
    <circle cx="30" cy="90" r="10" fill="#2dd4a8"/>
    <text x="48" y="85" fill="#2dd4a8" font-size="12" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">伸展</text>
    <text x="48" y="120" fill="#8b9bb0" font-size="10" font-family="Segoe UI,PingFang TC,sans-serif">下壓＝肘伸</text>
  </g>
  <text x="40" y="310" fill="#e8eef5" font-size="12" font-family="Segoe UI,PingFang TC,sans-serif">屈：肱肌（主力）＋肱二頭＋肱橈</text>
  <text x="40" y="332" fill="#e8eef5" font-size="12" font-family="Segoe UI,PingFang TC,sans-serif">伸：肱三頭肌</text>
  <text x="40" y="354" fill="#8b9bb0" font-size="11" font-family="Segoe UI,PingFang TC,sans-serif">口訣：肱肌才是屈肘主力</text>

  <!-- Pronation/supination -->
  <rect x="356" y="56" width="320" height="320" rx="12" fill="#212b38" stroke="#e6b450" stroke-width="1.2"/>
  <text x="516" y="84" text-anchor="middle" fill="#e6b450" font-size="14" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">前臂：旋前 ↔ 旋後</text>
  <!-- palm down -->
  <g transform="translate(390,130)">
    <ellipse cx="50" cy="40" rx="36" ry="22" fill="#3a4555" stroke="#e6b450" stroke-width="2"/>
    <text x="50" y="45" text-anchor="middle" fill="#e6b450" font-size="11" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">掌心下</text>
    <text x="50" y="90" text-anchor="middle" fill="#e6b450" font-size="13" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">旋前</text>
    <text x="50" y="108" text-anchor="middle" fill="#8b9bb0" font-size="10" font-family="Segoe UI,PingFang TC,sans-serif">像倒出水</text>
  </g>
  <!-- palm up -->
  <g transform="translate(530,130)">
    <ellipse cx="50" cy="40" rx="36" ry="22" fill="#3a4555" stroke="#2dd4a8" stroke-width="2"/>
    <text x="50" y="45" text-anchor="middle" fill="#2dd4a8" font-size="11" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">掌心上</text>
    <text x="50" y="90" text-anchor="middle" fill="#2dd4a8" font-size="13" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">旋後</text>
    <text x="50" y="108" text-anchor="middle" fill="#8b9bb0" font-size="10" font-family="Segoe UI,PingFang TC,sans-serif">像托碗</text>
  </g>
  <path d="M470 160 Q516 130 560 160" fill="none" stroke="#8b9bb0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="372" y="290" fill="#e8eef5" font-size="12" font-family="Segoe UI,PingFang TC,sans-serif">旋前：旋前圓肌＋旋前方肌</text>
  <text x="372" y="312" fill="#e8eef5" font-size="12" font-family="Segoe UI,PingFang TC,sans-serif">旋後：肱二頭＋旋後肌</text>
  <text x="372" y="340" fill="#e6b450" font-size="11" font-family="Segoe UI,PingFang TC,sans-serif">≠ 肩／髖的內轉外轉！</text>
  <text x="372" y="358" fill="#8b9bb0" font-size="10" font-family="Segoe UI,PingFang TC,sans-serif">這裡轉的是掌心（橈尺骨）</text>
</svg>
