<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
  <title id="t">側平舉示意</title>
  <desc id="d">側平舉額狀面外展</desc>
  <rect width="640" height="400" rx="16" fill="#1a222d"/>
  <text x="24" y="34" fill="#3d9cf0" font-size="18" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">側平舉怎麼做</text>
  <text x="24" y="54" fill="#8b9bb0" font-size="12" font-family="Segoe UI,PingFang TC,sans-serif">肩關節 · 額狀面 · 外展 · 三角中束＋棘上</text>

  <!-- figure -->
  <g transform="translate(200,80)">
    <circle cx="120" cy="30" r="20" fill="#2a3544" stroke="#c5d0dc" stroke-width="2"/>
    <line x1="120" y1="50" x2="120" y2="160" stroke="#c5d0dc" stroke-width="12" stroke-linecap="round"/>
    <!-- arms raised to side -->
    <line x1="120" y1="70" x2="20" y2="80" stroke="#3d9cf0" stroke-width="10" stroke-linecap="round"/>
    <line x1="120" y1="70" x2="220" y2="80" stroke="#3d9cf0" stroke-width="10" stroke-linecap="round"/>
    <!-- dumbbells -->
    <rect x="5" y="72" width="20" height="16" rx="3" fill="#e6b450"/>
    <rect x="215" y="72" width="20" height="16" rx="3" fill="#e6b450"/>
    <!-- legs -->
    <line x1="120" y1="160" x2="80" y2="260" stroke="#c5d0dc" stroke-width="10" stroke-linecap="round"/>
    <line x1="120" y1="160" x2="160" y2="260" stroke="#c5d0dc" stroke-width="10" stroke-linecap="round"/>
    <!-- frontal plane hint -->
    <rect x="40" y="40" width="160" height="8" rx="2" fill="#2dd4a8" opacity="0.35"/>
    <text x="120" y="290" text-anchor="middle" fill="#2dd4a8" font-size="12" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="600">額狀面（前後切開）</text>
  </g>

  <g font-family="Segoe UI,PingFang TC,sans-serif">
    <rect x="400" y="80" width="210" height="260" rx="10" fill="#212b38" stroke="#2d3a4a"/>
    <text x="416" y="110" fill="#3d9cf0" font-size="13" font-weight="700">步驟摘要</text>
    <text x="416" y="138" fill="#e8eef5" font-size="12">1. 站直、沉肩</text>
    <text x="416" y="160" fill="#e8eef5" font-size="12">2. 肘微彎像提水桶</text>
    <text x="416" y="182" fill="#e8eef5" font-size="12">3. 兩側舉到約肩高</text>
    <text x="416" y="204" fill="#e8eef5" font-size="12">4. 慢控放下</text>
    <text x="416" y="236" fill="#2dd4a8" font-size="12" font-weight="700">考題拆解</text>
    <text x="416" y="258" fill="#8b9bb0" font-size="11">關節：肩（盂肱）</text>
    <text x="416" y="276" fill="#8b9bb0" font-size="11">平面：額狀面</text>
    <text x="416" y="294" fill="#8b9bb0" font-size="11">動作：外展</text>
    <text x="416" y="312" fill="#8b9bb0" font-size="11">主力：三角中＋棘上</text>
  </g>
</svg>
