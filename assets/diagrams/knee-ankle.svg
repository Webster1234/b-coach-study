<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img" aria-labelledby="t d">
  <title id="t">膝與踝動作</title>
  <desc id="d">膝屈伸、背屈跖屈</desc>
  <rect width="700" height="380" rx="16" fill="#1a222d"/>
  <text x="24" y="34" fill="#3d9cf0" font-size="18" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">膝屈伸 · 踝背屈／蹠屈</text>

  <!-- Knee -->
  <rect x="24" y="56" width="320" height="290" rx="12" fill="#212b38" stroke="#3d9cf0" stroke-width="1.2"/>
  <text x="184" y="84" text-anchor="middle" fill="#3d9cf0" font-size="14" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">膝關節</text>
  <!-- flexed -->
  <g transform="translate(50,110)">
    <line x1="40" y1="10" x2="40" y2="90" stroke="#c5d0dc" stroke-width="14" stroke-linecap="round"/>
    <line x1="40" y1="90" x2="110" y2="140" stroke="#c5d0dc" stroke-width="12" stroke-linecap="round"/>
    <circle cx="40" cy="90" r="9" fill="#3d9cf0"/>
    <text x="60" y="80" fill="#3d9cf0" font-size="12" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">屈曲</text>
    <text x="60" y="98" fill="#8b9bb0" font-size="10" font-family="Segoe UI,PingFang TC,sans-serif">腳跟往屁股</text>
  </g>
  <!-- extended -->
  <g transform="translate(200,100)">
    <line x1="40" y1="10" x2="40" y2="160" stroke="#c5d0dc" stroke-width="14" stroke-linecap="round"/>
    <circle cx="40" cy="80" r="9" fill="#2dd4a8"/>
    <text x="58" y="75" fill="#2dd4a8" font-size="12" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">伸展</text>
    <text x="58" y="93" fill="#8b9bb0" font-size="10" font-family="Segoe UI,PingFang TC,sans-serif">把膝蓋蹬直</text>
  </g>
  <text x="44" y="290" fill="#e8eef5" font-size="12" font-family="Segoe UI,PingFang TC,sans-serif">屈＝腿後腱　伸＝股四頭</text>
  <text x="44" y="312" fill="#8b9bb0" font-size="11" font-family="Segoe UI,PingFang TC,sans-serif">前面伸、後面屈（超好記）</text>

  <!-- Ankle -->
  <rect x="356" y="56" width="320" height="290" rx="12" fill="#212b38" stroke="#e6b450" stroke-width="1.2"/>
  <text x="516" y="84" text-anchor="middle" fill="#e6b450" font-size="14" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">踝關節</text>
  <!-- dorsiflexion -->
  <g transform="translate(390,120)">
    <line x1="40" y1="10" x2="40" y2="80" stroke="#c5d0dc" stroke-width="12" stroke-linecap="round"/>
    <path d="M40 80 L100 70" stroke="#2dd4a8" stroke-width="10" stroke-linecap="round"/>
    <path d="M90 55 L110 50" stroke="#2dd4a8" stroke-width="2" fill="none"/>
    <text x="70" y="120" fill="#2dd4a8" font-size="13" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">背屈</text>
    <text x="70" y="138" fill="#8b9bb0" font-size="10" font-family="Segoe UI,PingFang TC,sans-serif">腳尖抬頭</text>
  </g>
  <!-- plantarflexion -->
  <g transform="translate(530,120)">
    <line x1="40" y1="10" x2="40" y2="80" stroke="#c5d0dc" stroke-width="12" stroke-linecap="round"/>
    <path d="M40 80 L95 120" stroke="#e6b450" stroke-width="10" stroke-linecap="round"/>
    <text x="55" y="150" fill="#e6b450" font-size="13" font-family="Segoe UI,PingFang TC,sans-serif" font-weight="700">蹠屈</text>
    <text x="55" y="168" fill="#8b9bb0" font-size="10" font-family="Segoe UI,PingFang TC,sans-serif">腳尖點地</text>
  </g>
  <text x="372" y="290" fill="#e8eef5" font-size="12" font-family="Segoe UI,PingFang TC,sans-serif">背屈＝脛骨前肌</text>
  <text x="372" y="312" fill="#e8eef5" font-size="12" font-family="Segoe UI,PingFang TC,sans-serif">蹠屈＝腓腸肌＋比目魚（提踵）</text>
  <text x="372" y="334" fill="#e6b450" font-size="11" font-family="Segoe UI,PingFang TC,sans-serif">也寫「跖屈」＝同一件事</text>
</svg>
